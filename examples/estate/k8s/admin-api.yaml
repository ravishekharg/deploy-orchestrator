apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: shop
  labels:
    app: admin-api
    tier: edge
  annotations:
    orch/deploy-seconds: '47'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      initContainers:
      - name: wait-auth
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://auth:5678; do sleep 1; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      - name: wait-loyalty
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://loyalty:5678; do sleep 1; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - -text
        - admin-api ok
        - -listen
        - :5678
        env:
        - name: AUTH_URL
          value: http://auth.shop.svc.cluster.local:5678
        - name: LOYALTY_URL
          value: http://loyalty.shop.svc.cluster.local:5678
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: shop
spec:
  selector:
    app: admin-api
  ports:
  - port: 5678
    targetPort: 5678
