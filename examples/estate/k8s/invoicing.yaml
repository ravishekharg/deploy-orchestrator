apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoicing
  namespace: shop
  labels:
    app: invoicing
    tier: domain
  annotations:
    orch/deploy-seconds: '80'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoicing
  template:
    metadata:
      labels:
        app: invoicing
    spec:
      initContainers:
      - name: wait-catalog
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://catalog:5678; do sleep 1; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      - name: wait-kafka
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://kafka:5678; do sleep 1; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - -text
        - invoicing ok
        - -listen
        - :5678
        env:
        - name: CATALOG_URL
          value: http://catalog.shop.svc.cluster.local:5678
        - name: KAFKA_URL
          value: http://kafka.shop.svc.cluster.local:5678
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: invoicing
  namespace: shop
spec:
  selector:
    app: invoicing
  ports:
  - port: 5678
    targetPort: 5678
