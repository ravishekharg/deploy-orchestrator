apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: shop
  labels:
    app: elasticsearch
    tier: data
  annotations:
    orch/deploy-seconds: '229'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers: []
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - -text
        - elasticsearch ok
        - -listen
        - :5678
        env: []
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: shop
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 5678
    targetPort: 5678
