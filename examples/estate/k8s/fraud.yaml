apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
  namespace: shop
  labels:
    app: fraud
    tier: domain
  annotations:
    orch/deploy-seconds: '61'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud
  template:
    metadata:
      labels:
        app: fraud
    spec:
      initContainers:
      - name: wait-users
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://users:5678; do sleep 1; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - -text
        - fraud ok
        - -listen
        - :5678
        env:
        - name: USERS_URL
          value: http://users.shop.svc.cluster.local:5678
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fraud
  namespace: shop
spec:
  selector:
    app: fraud
  ports:
  - port: 5678
    targetPort: 5678
