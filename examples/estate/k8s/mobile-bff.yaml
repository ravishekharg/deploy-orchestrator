apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-bff
  namespace: shop
  labels:
    app: mobile-bff
    tier: edge
  annotations:
    orch/deploy-seconds: '37'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-bff
  template:
    metadata:
      labels:
        app: mobile-bff
    spec:
      initContainers:
      - name: wait-config
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://config:5678; do sleep 1; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - -text
        - mobile-bff ok
        - -listen
        - :5678
        env:
        - name: CONFIG_URL
          value: http://config.shop.svc.cluster.local:5678
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-bff
  namespace: shop
spec:
  selector:
    app: mobile-bff
  ports:
  - port: 5678
    targetPort: 5678
